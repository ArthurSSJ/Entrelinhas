<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Bancada de render</title>
    <style>
      html, body { margin: 0; background: #101014; }
      canvas { display: block; margin: 20px auto; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "/node_modules/three/build/three.module.js",
          "three/addons/": "/node_modules/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="tela"></canvas>

    <script type="module">
      import * as THREE from "three";
      import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
      import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

      const tela = document.getElementById("tela");
      const renderer = new THREE.WebGLRenderer({
        canvas: tela,
        alpha: true,
        antialias: true,
        preserveDrawingBuffer: true,
      });
      renderer.setPixelRatio(2);
      renderer.setClearColor(0x000000, 0);
      renderer.toneMapping = THREE.NeutralToneMapping;
      renderer.toneMappingExposure = 1.05;
      renderer.outputColorSpace = THREE.SRGBColorSpace;

      // Reflexo de estúdio: é ele que dá o brilho de plástico nas curvas.
      const pmrem = new THREE.PMREMGenerator(renderer);
      const ambiente = pmrem.fromScene(new RoomEnvironment(), 0.035).texture;

      /* ---------- paleta ---------- */
      const ROSA_CLARO = 0xffabc7;
      const ROSA = 0xf62d68;
      const ROSA_FORTE = 0xc70b41;
      const VINHO = 0xa80b39;
      const BRANCO = 0xfff3f6;

      function plastico(cor, extra = {}) {
        return new THREE.MeshPhysicalMaterial({
          color: cor,
          metalness: 0,
          roughness: 0.3,
          clearcoat: 1,
          clearcoatRoughness: 0.1,
          sheen: 0.6,
          sheenRoughness: 0.5,
          sheenColor: new THREE.Color(0xffffff),
          envMapIntensity: 1.15,
          ...extra,
        });
      }

      /* ---------- formas ---------- */

      function formaCoracao() {
        const s = new THREE.Shape();
        s.moveTo(0, 0.5);
        s.bezierCurveTo(0, 0.5, -0.4, 1.15, -1.05, 1.15);
        s.bezierCurveTo(-1.95, 1.15, -1.95, 0.0, -1.95, 0.0);
        s.bezierCurveTo(-1.95, -0.62, -1.4, -1.3, 0, -2.05);
        s.bezierCurveTo(1.4, -1.3, 1.95, -0.62, 1.95, 0.0);
        s.bezierCurveTo(1.95, 0.0, 1.95, 1.15, 1.05, 1.15);
        s.bezierCurveTo(0.4, 1.15, 0, 0.5, 0, 0.5);
        return s;
      }

      /** Retângulo arredondado com bico embaixo, à esquerda. */
      function formaBalao(l, a, r) {
        const s = new THREE.Shape();
        const x = -l / 2;
        const y = -a / 2;
        const bicoIni = x + r + 0.62;
        const bicoFim = x + r + 0.14;

        s.moveTo(bicoIni, y);
        s.lineTo(x + l - r, y);
        s.quadraticCurveTo(x + l, y, x + l, y + r);
        s.lineTo(x + l, y + a - r);
        s.quadraticCurveTo(x + l, y + a, x + l - r, y + a);
        s.lineTo(x + r, y + a);
        s.quadraticCurveTo(x, y + a, x, y + a - r);
        s.lineTo(x, y + r);
        s.quadraticCurveTo(x, y, x + r, y);
        s.lineTo(bicoFim, y);
        s.quadraticCurveTo(bicoFim - 0.1, y - 0.42, bicoIni - 0.02, y - 0.52);
        s.quadraticCurveTo(bicoIni - 0.02, y - 0.2, bicoIni, y);
        return s;
      }

      function formaTriangulo(lado, r) {
        const h = (lado * Math.sqrt(3)) / 2;
        const p = [
          new THREE.Vector2(0, (2 / 3) * h),
          new THREE.Vector2(lado / 2, -h / 3),
          new THREE.Vector2(-lado / 2, -h / 3),
        ];
        const s = new THREE.Shape();
        for (let i = 0; i < 3; i++) {
          const atual = p[i];
          const proximo = p[(i + 1) % 3];
          const anterior = p[(i + 2) % 3];
          const paraAnterior = anterior.clone().sub(atual).normalize().multiplyScalar(r);
          const paraProximo = proximo.clone().sub(atual).normalize().multiplyScalar(r);
          const entrada = atual.clone().add(paraAnterior);
          const saida = atual.clone().add(paraProximo);
          if (i === 0) s.moveTo(entrada.x, entrada.y);
          else s.lineTo(entrada.x, entrada.y);
          s.quadraticCurveTo(atual.x, atual.y, saida.x, saida.y);
        }
        return s;
      }

      function inflar(forma, { profundidade = 0.5, bisel = 0.34, curvas = 48 } = {}) {
        const geo = new THREE.ExtrudeGeometry(forma, {
          depth: profundidade,
          bevelEnabled: true,
          bevelThickness: bisel,
          bevelSize: bisel,
          bevelSegments: 14,
          curveSegments: curvas,
        });
        geo.center();
        geo.computeVertexNormals();
        return geo;
      }

      /* ---------- peças ---------- */

      function coracao(cor = ROSA, escala = 1) {
        const m = new THREE.Mesh(inflar(formaCoracao(), { profundidade: 0.55, bisel: 0.36 }), plastico(cor));
        m.scale.setScalar(escala);
        return m;
      }

      function balao(cor, l = 3.0, a = 2.1) {
        const g = new THREE.Group();
        const corpo = new THREE.Mesh(
          inflar(formaBalao(l, a, 0.55), { profundidade: 0.42, bisel: 0.24 }),
          plastico(cor),
        );
        g.add(corpo);

        // Três pontinhos de "digitando", em relevo na frente.
        const pontos = new THREE.Group();
        for (let i = -1; i <= 1; i++) {
          const p = new THREE.Mesh(
            new THREE.SphereGeometry(0.19, 32, 24),
            plastico(cor === BRANCO ? ROSA : BRANCO, { clearcoatRoughness: 0.2 }),
          );
          p.position.set(i * 0.58, 0.05, 0.52);
          p.scale.z = 0.5;
          pontos.add(p);
        }
        g.add(pontos);
        return g;
      }

      function presente() {
        const g = new THREE.Group();
        const caixa = new THREE.Mesh(new RoundedBoxGeometry(2.4, 1.9, 2.4, 7, 0.26), plastico(ROSA));
        caixa.position.y = -0.35;
        g.add(caixa);

        const tampa = new THREE.Mesh(new RoundedBoxGeometry(2.75, 0.66, 2.75, 7, 0.22), plastico(ROSA_CLARO));
        tampa.position.y = 0.95;
        g.add(tampa);

        for (const eixo of ["x", "z"]) {
          const fita = new THREE.Mesh(
            new RoundedBoxGeometry(eixo === "x" ? 2.86 : 0.46, 2.54, eixo === "x" ? 0.46 : 2.86, 4, 0.1),
            plastico(ROSA_FORTE),
          );
          fita.position.y = 0;
          g.add(fita);
        }

        const laco = new THREE.Group();
        for (const lado of [-1, 1]) {
          const alca = new THREE.Mesh(new THREE.TorusGeometry(0.52, 0.17, 24, 48), plastico(ROSA_FORTE));
          alca.position.set(lado * 0.5, 1.75, 0);
          alca.rotation.z = lado * 0.5;
          alca.scale.set(1, 0.8, 0.55);
          laco.add(alca);
        }
        const no = new THREE.Mesh(new THREE.SphereGeometry(0.24, 32, 24), plastico(ROSA_FORTE));
        no.position.y = 1.72;
        laco.add(no);
        g.add(laco);
        return g;
      }

      function alerta() {
        const g = new THREE.Group();
        const corpo = new THREE.Mesh(
          inflar(formaTriangulo(4.1, 0.62), { profundidade: 0.6, bisel: 0.3 }),
          plastico(ROSA_FORTE),
        );
        g.add(corpo);

        const haste = new THREE.Mesh(new THREE.CapsuleGeometry(0.19, 0.72, 12, 28), plastico(BRANCO));
        haste.position.set(0, 0.34, 0.62);
        g.add(haste);

        const ponto = new THREE.Mesh(new THREE.SphereGeometry(0.23, 32, 24), plastico(BRANCO));
        ponto.position.set(0, -0.55, 0.62);
        g.add(ponto);
        return g;
      }

      function cadeado() {
        const g = new THREE.Group();
        const corpo = new THREE.Mesh(new RoundedBoxGeometry(2.6, 2.0, 1.2, 7, 0.4), plastico(ROSA));
        corpo.position.y = -0.5;
        g.add(corpo);

        const arco = new THREE.Mesh(
          new THREE.TorusGeometry(0.78, 0.22, 24, 48, Math.PI),
          plastico(VINHO, { roughness: 0.22 }),
        );
        arco.position.y = 0.5;
        g.add(arco);
        for (const lado of [-1, 1]) {
          const perna = new THREE.Mesh(new THREE.CapsuleGeometry(0.22, 0.5, 12, 24), plastico(VINHO));
          perna.position.set(lado * 0.78, 0.25, 0);
          g.add(perna);
        }

        const furo = new THREE.Mesh(new THREE.SphereGeometry(0.3, 32, 24), plastico(BRANCO));
        furo.position.set(0, -0.3, 0.62);
        furo.scale.z = 0.5;
        g.add(furo);
        const risco = new THREE.Mesh(new THREE.CapsuleGeometry(0.12, 0.4, 10, 20), plastico(BRANCO));
        risco.position.set(0, -0.75, 0.6);
        risco.scale.z = 0.5;
        g.add(risco);
        return g;
      }

      /* ---------- montagem ---------- */

      function cenaBase() {
        const cena = new THREE.Scene();
        cena.environment = ambiente;

        const chave = new THREE.DirectionalLight(0xffffff, 2.1);
        chave.position.set(-4, 6, 7);
        cena.add(chave);

        const contra = new THREE.DirectionalLight(0xff5c8a, 3.2);
        contra.position.set(6, -2, -5);
        cena.add(contra);

        const topo = new THREE.DirectionalLight(0xffe4ec, 1.4);
        topo.position.set(2, 8, -2);
        cena.add(topo);

        cena.add(new THREE.AmbientLight(0xff9dbb, 0.28));
        return cena;
      }

      const pecas = {
        heroi(cena) {
          const g = new THREE.Group();

          const principal = coracao(ROSA, 1.15);
          principal.position.set(0.15, -0.25, 0);
          principal.rotation.set(0.12, -0.34, 0.08);
          g.add(principal);

          const b1 = balao(BRANCO, 2.9, 2.0);
          b1.position.set(-3.15, 2.05, -0.6);
          b1.rotation.set(0.1, 0.42, 0.14);
          g.add(b1);

          const b2 = balao(ROSA_FORTE, 2.5, 1.8);
          b2.position.set(3.25, -1.95, -0.5);
          b2.rotation.set(-0.08, -0.46, -0.12);
          g.add(b2);

          const mini = [
            { p: [3.1, 2.5, 0.6], e: 0.34, r: [0.2, -0.3, -0.35] },
            { p: [-2.6, -2.35, 0.5], e: 0.26, r: [0.1, 0.4, 0.4] },
            { p: [1.5, 3.3, -0.4], e: 0.19, r: [0, 0, 0.2] },
          ];
          for (const m of mini) {
            const c = coracao(ROSA_CLARO, m.e);
            c.position.set(...m.p);
            c.rotation.set(...m.r);
            g.add(c);
          }

          cena.add(g);
          return { grupo: g, distancia: 15.4 };
        },

        coracao(cena) {
          const g = new THREE.Group();
          const c = coracao(ROSA, 1);
          c.rotation.set(0.14, -0.36, 0.06);
          g.add(c);
          cena.add(g);
          return { grupo: g, distancia: 10.4 };
        },

        alerta(cena) {
          const g = alerta();
          g.rotation.set(0.1, -0.3, 0);
          cena.add(g);
          return { grupo: g, distancia: 11.6 };
        },

        presente(cena) {
          const g = presente();
          g.rotation.set(0.16, -0.55, 0);
          cena.add(g);
          return { grupo: g, distancia: 11.8 };
        },

        cadeado(cena) {
          const g = cadeado();
          g.rotation.set(0.12, -0.42, 0);
          cena.add(g);
          return { grupo: g, distancia: 10.8 };
        },
      };

      const lista = [
        { nome: "heroi", l: 1300, a: 1040 },
        { nome: "coracao", l: 760, a: 760 },
        { nome: "alerta", l: 760, a: 760 },
        { nome: "presente", l: 760, a: 760 },
        { nome: "cadeado", l: 760, a: 760 },
      ];

      async function rodar() {
        for (const item of lista) {
          const cena = cenaBase();
          const { distancia } = pecas[item.nome](cena);

          const camera = new THREE.PerspectiveCamera(30, item.l / item.a, 0.1, 100);
          camera.position.set(0, 0, distancia);
          camera.lookAt(0, 0, 0);

          // pixelRatio 2 + metade do tamanho lógico = buffer no tamanho final.
          renderer.setSize(item.l / 2, item.a / 2);

          renderer.render(cena, camera);
          await new Promise((r) => requestAnimationFrame(r));
          renderer.render(cena, camera);

          const dados = tela.toDataURL("image/png");
          await fetch(`/salvar?nome=${item.nome}`, { method: "POST", body: dados });

          cena.traverse((o) => {
            if (o.geometry) o.geometry.dispose();
          });
        }
        window.__pronto = true;
      }

      rodar().catch((e) => {
        window.__erro = String(e && e.stack ? e.stack : e);
      });
    </script>
  </body>
</html>
